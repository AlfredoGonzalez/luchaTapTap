name: Crear AAB para Play

# Se ejecuta a mano: GitHub > Actions > "Crear AAB para Play" > Run workflow.
# Firma con la llave de subida guardada en los secretos del repositorio:
#   UPLOAD_KEYSTORE_BASE64  el archivo upload-keystore.jks en base64
#   UPLOAD_KEYSTORE_PASSWORD
#   UPLOAD_KEY_ALIAS        (por ejemplo: upload)
#   UPLOAD_KEY_PASSWORD     (la misma que la del almacén si no pusiste otra)
# El .aab queda como artefacto de esta ejecución (Actions > la ejecución >
# Artifacts) para subirlo a Play Console. El número de versión sube solo.
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Revisar los secretos de la llave
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing UPLOAD_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing"
            exit 1
          fi
      - name: Preparar la llave
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Compilar AAB firmado
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Borrar la llave
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: lucha-tap-tap-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
