name: Probar APK en emulador

# A mano: GitHub > Actions > "Probar APK en emulador" > Run workflow.
# Compila el APK, lo instala en un emulador Android y muestra el registro del
# arranque (para diagnosticar cierres o "no responde").
on:
  workflow_dispatch:

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y prueba de arranque
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/emulator_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-arranque
          path: smoke.png
          if-no-files-found: ignore
